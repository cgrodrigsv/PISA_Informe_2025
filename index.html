      const mapRef = React.useRef(null);
      const chartInstance = React.useRef(null);
      const [geoData, setGeoData] = React.useState(null);

      React.useEffect(() => {
        fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson')
          .then(res => res.json())
          .then(json => {
            window.echarts.registerMap('world', json);
            setGeoData(json);
          })
          .catch(err => console.error("Error loading map", err));
      }, []);

      React.useEffect(() => {
        if (!geoData || !mapRef.current) return;
        
        if (!chartInstance.current) {
          chartInstance.current = window.echarts.init(mapRef.current, null, { renderer: 'canvas' });
        }

        const mapData = data.map(c => ({
          name: c.name,
          value: c[selectedDomain] || c.science
        }));

        const option = {
          backgroundColor: 'transparent',
          tooltip: {
            trigger: 'item',
            formatter: '{b}: {c} pts',
            backgroundColor: 'rgba(15, 23, 42, 0.9)',

      ]);

      // Handle Theme Toggle
      useEffect(() => {
        if (isDarkMode) document.documentElement.classList.add('dark');

      }, [isDarkMode]);

      const filteredCountries = COUNTRY_LIST
        .filter(c => c.name.toLowerCase().includes(searchTerm.toLowerCase()) || c.code.toLowerCase().includes(searchTerm.toLowerCase()))
        .sort((a, b) => b[sortBy] - a[sortBy]);

      const handleExportCSV = () => {
        const headers = ["País", "Código", "Ciencias", "Matemáticas", "Lectura", "Digital", "Rezago (%)", "Excelencia (%)"];
        const csvRows = [headers.join(",")];
        
        filteredCountries.forEach(c => {
          const row = [`"${c.name}"`, c.code, c.science, c.math, c.reading, c.digital, c.low, c.top];
          csvRows.push(row.join(","));
        });
        
        const csvData = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvRows.join("\n")], { type: "text/csv;charset=utf-8;" });
        const csvUrl = URL.createObjectURL(csvData);
        const link = document.createElement("a");
        link.href = csvUrl;
        link.setAttribute("download", `PISA_2025_Resultados_${sortBy}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleSendQuery = (qText) => {
        const q = qText || userQuery;
        if (!q.trim()) return;
        const newMsgs = [...messages, { sender: 'user', text: q }];
        setMessages(newMsgs);
        setUserQuery('');

        setTimeout(() => {
          const lq = q.toLowerCase();
          let ans = "No encontré datos exactos. Intenta preguntar por un país específico (ej: México), una materia (matemáticas) o conceptos como 'equidad' o 'IA'.";

            setSortBy('reading');

            actionTaken = true;

                      <div className="text-right">
                        <div className="text-lg font-black text-white">{sys.science} pts</div>
                        <div className="text-xs font-bold text-rose-400">{sys.change10yr} pts 10a</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* TENDENCIAS HISTORICAS */}
            <section id="tendencias" className="pt-8 border-t border-[#19406B] scroll-mt-32">
              <HistoricalTrends />
            </section>

            {/* IMPACTO SOCIOECONOMICO */}
            <section id="equidad" className="pt-8 border-t border-[#19406B] scroll-mt-32">
              <SocioeconomicImpact />
            </section>

            {/* HABILIDADES DEL FUTURO */}
            <section id="habilidades" className="pt-8 border-t border-[#19406B] scroll-mt-32">
              <div className="mb-6">
                <h3 className="text-2xl font-extrabold text-white">Habilidades del Futuro: <span className="text-gradient-sky">Competencias Cognitivas y Digitales</span></h3>
                <p className="text-xs text-slate-400 mt-1">Desglose de rendimiento en pensamiento computacional, indagación científica y evaluación de IA.</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {FUTURE_SKILLS.map(sk => (
                  <div key={sk.skill} className="glass-card p-4 rounded-2xl">
                    <h4 className="font-bold text-white text-sm mb-1">{sk.skill}</h4>
                    <p className="text-xs text-slate-400 mb-3">{sk.desc}</p>
                    <div className="flex justify-between items-center text-xs">
                      <span className="text-amber-400 font-bold">OCDE: {sk.oecd} pts</span>
                      <span className="text-sky-300 font-bold">Líder: {sk.topCountry} ({sk.topScore} pts)</span>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* EXPLORADOR DE PAISES */}
            <section id="explorador" className="pt-8 border-t border-slate-800 scroll-mt-32">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                <div>
                  <h3 className="text-2xl font-extrabold text-white">Explorador de <span className="text-gradient-sky">Sistemas Educativos</span></h3>
                  <p className="text-xs text-slate-400">Resultados de los 85 países evaluados en PISA 2025.</p>
                </div>

                <div className="flex items-center gap-3 w-full md:w-auto">
                  <button 
                    onClick={handleExportCSV}
                    className="p-2 rounded-xl bg-slate-800 hover:bg-[#0061D2] text-slate-300 hover:text-white transition-colors border border-slate-700 shadow-md flex items-center justify-center"
                    title="Exportar tabla a CSV"
                    aria-label="Exportar a CSV"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                  </button>
                  <input
                    type="text"
                    placeholder="Buscar país..."
                    value={searchTerm}
                    onChange={e => setSearchTerm(e.target.value)}
                    className="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500"
                  />
                  <select
                    value={sortBy}
                    onChange={e => setSortBy(e.target.value)}
                    className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                  >
                    <option value="science">Ciencias</option>
                    <option value="math">Matemáticas</option>
                    <option value="reading">Lectura</option>
                    <option value="digital">Digital</option>
                  </select>
                </div>
              </div>

              <div className="glass-card rounded-3xl overflow-hidden border border-slate-800">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-900 text-slate-400 uppercase font-bold border-b border-slate-800">
                      <tr>
                        <th className="p-4">País</th>
                        <th className="p-4 text-center">Ciencias</th>
                        <th className="p-4 text-center">Matemáticas</th>
                        <th className="p-4 text-center">Lectura</th>
                        <th className="p-4 text-center">Mundo Digital</th>
                        <th className="p-4 text-center">% Top Performers</th>
                        <th className="p-4 text-center">% Low Achievers</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {filteredCountries.map(c => (
                        <tr key={c.code} className="hover:bg-brand-500/50 cursor-pointer transition-colors" onClick={() => setSelectedCountry(c)} title={`Ver perfil de ${c.name}`}>
                          <td className="p-4 font-bold text-white flex items-center gap-2">
                            {c.name} 
                            <span className="text-[10px] text-brand-300 font-mono bg-brand-500/30 px-1 rounded">({c.code})</span>
                          </td>
                          <td className="p-4 text-center font-bold text-sky-400">{c.science}</td>
                          <td className="p-4 text-center font-bold text-indigo-400">{c.math}</td>
                          <td className="p-4 text-center font-bold text-emerald-400">{c.reading}</td>
                          <td className="p-4 text-center font-bold text-amber-400">{c.digital}</td>
                          <td className="p-4 text-center text-emerald-400">{c.top}%</td>
                          <td className="p-4 text-center text-rose-400">{c.low}%</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </section>

          </main>

          {/* COUNTRY PROFILE MODAL */}
          {selectedCountry && (
            <CountryProfileModal country={selectedCountry} onClose={() => setSelectedCountry(null)} />
          )}

          {/* RAG MODAL */}
          {isRagModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-card w-full max-w-xl rounded-3xl p-6 border border-indigo-500/30 space-y-4">
                <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                  <h3 className="font-bold text-white text-base">Asistente RAG PISA 2025</h3>
                  <button onClick={() => setIsRagModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="h-64 overflow-y-auto space-y-3 p-2 bg-slate-900/60 rounded-xl">
                  {messages.map((m, idx) => (
                    <div key={idx} className={`p-3 rounded-xl text-xs leading-relaxed ${m.sender === 'user' ? 'bg-sky-500 text-white ml-8' : 'bg-slate-800 text-slate-200 mr-8'}`}>
                      {m.text}
                    </div>
                  ))}
                </div>

                <form onSubmit={e => { e.preventDefault(); handleSendQuery(); }} className="flex gap-2">
                  <input
                    type="text"
                    placeholder="Pregunta algo sobre PISA 2025..."
                    value={userQuery}
                    onChange={e => setUserQuery(e.target.value)}
                    className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none"
                  />
                  <button type="submit" className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs">Enviar</button>
                </form>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-800 py-6 text-center text-xs text-slate-500 mt-12">
            Basado en el documento oficial PISA 2025 Results (Volume I) • OCDE © 2026
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
